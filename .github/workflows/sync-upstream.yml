name: Sync upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/blakeblackshear/frigate-hass-addons.git
          git fetch upstream main

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "New upstream commits: $BEHIND"
          echo "### Sync upstream" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date, nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git merge upstream/main --no-edit -m "chore: sync upstream updates"; then
            echo "Conflicts detected, auto-resolving..."
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                *.yaml) cfg=yes ;;
                *)      cfg=no ;;
              esac
              awk -v cfg="$cfg" '
                /^<<<<<<</ && mode == ""       { mode = "ours"; next }
                /^=======$/ && mode == "ours"  { mode = "theirs"; next }
                /^>>>>>>> / && mode == "theirs" {
                  if (cfg == "yes") {
                    for (i = 1; i <= no; i++) if (ours[i] !~ /^version:/) print ours[i]
                    for (i = 1; i <= nt; i++) if (theirs[i] ~ /^version:/) print theirs[i]
                  } else {
                    for (i = 1; i <= nt; i++) print theirs[i]
                  }
                  mode = ""; no = 0; nt = 0; next
                }
                mode == "ours"   { ours[++no] = $0; next }
                mode == "theirs" { theirs[++nt] = $0; next }
                { print }
              ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
              if grep -q "^<<<<<<< " "$f"; then
                echo "::error::Unresolved conflict markers remain in $f"
                exit 1
              fi
              echo "resolved: $f"
            done
            git add -A
            git commit -m "chore: sync upstream updates (conflicts auto-resolved)"
          fi

          echo "Merged upstream commits:" >> "$GITHUB_STEP_SUMMARY"
          git log --oneline HEAD^..upstream/main >> "$GITHUB_STEP_SUMMARY" || true

          git push
